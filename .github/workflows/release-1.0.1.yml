name: Release 1.0.1

# one-off: publish nv27 1.0.1 as the v1.0.1 release, tagged at master's 1.0.1 merge commit (dcbaf59, PR #2), with the
# app CI built from that commit (run 38707313968) and the "## 1.0.1" section of RELEASE_NOTES.md as its notes;
# marked as the latest release, which the README's download link points to
on:
  push:
    paths:
      - .github/workflows/release-1.0.1.yml

permissions:
  actions: read
  contents: write

env:
  RELEASE_SHA: dcbaf598fcb86569e6467644cc5e04d6b815aad0
  BUILD_RUN: 38707313968

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the app built from the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view "$BUILD_RUN" --json headSha --jq .headSha)" = "$RELEASE_SHA"
          gh run download "$BUILD_RUN" --name nv27-arm64 --dir app
          ls -la app
          python3 - <<'EOF'
          import plistlib, zipfile
          with zipfile.ZipFile('app/nv27-arm64.zip') as z:
              info = plistlib.loads(z.read('nv27.app/Contents/Info.plist'))
          version = (info['CFBundleShortVersionString'], info['CFBundleVersion'])
          print('app version', version)
          assert version == ('1.0.1', '2'), version
          EOF

      - name: Release notes from RELEASE_NOTES.md
        run: |
          git show "$RELEASE_SHA:RELEASE_NOTES.md" | awk '/^## 1\.0\.1$/ {on=1; next} on && /^## / {exit} on' \
            | sed 's#(README.markdown)#(https://github.com/fengypants/nv27/blob/v1.0.1/README.markdown)#' > notes.md
          test -s notes.md
          cat notes.md

      - name: Publish v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.0.1 app/nv27-arm64.zip \
            --target "$RELEASE_SHA" \
            --title "nv27 1.0.1" \
            --notes-file notes.md \
            --latest
          gh release view v1.0.1
